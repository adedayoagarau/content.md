name: Publish contentmd to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-publish:
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Check out the released commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned package manager
        run: npm install --global pnpm@11.9.0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace from source
        run: pnpm build

      - name: Verify repository test suite
        run: pnpm test

      - name: Verify types and package boundaries
        run: pnpm lint

      - name: Verify independent foundation
        run: pnpm verify:foundation

      - name: Verify governed learning fixtures
        run: pnpm verify:learning

      - name: Verify the complete content-design benchmark
        run: pnpm verify:content-design-benchmark

      - name: Verify package and local-workbench security boundaries
        run: pnpm verify:security

      - name: Verify clean installation and regular-user journeys
        run: pnpm test:distribution

      - name: Verify release identity and tarball contents
        env:
          CONTENTMD_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm verify:release

      - name: Publish through npm trusted publishing
        working-directory: distribution/contentmd
        run: npm publish --access public
