name: Requalify learning runtime fixtures

on:
  push:
    branches:
      - codex/ux-taxonomy-calibration

permissions:
  contents: read

jobs:
  generate-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v6

      - name: Use exact Node 24.20.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install the pinned package manager
        run: npm install --global pnpm@11.9.0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime tuple
        run: node --print 'JSON.stringify({node:process.versions.node,v8:process.versions.v8,icu:process.versions.icu,unicode:process.versions.unicode,platform:process.platform,architecture:process.arch,endianness:require("node:os").endianness()})'

      - name: Build workspace packages
        run: pnpm build

      - name: Generate Linux x64 release fixtures
        run: |
          node --max-old-space-size=4096 --import tsx scripts/generate-pairwise-golden.mts
          node --max-old-space-size=4096 --import tsx scripts/generate-task6-simulator-golden.mts

      - name: Verify source manifests
        run: |
          node scripts/verify-pairwise-code-manifest.mjs
          node scripts/verify-task6-code-manifest.mjs

      - name: Upload Linux x64 fixtures
        uses: actions/upload-artifact@v4
        with:
          name: learning-runtime-linux-x64
          if-no-files-found: error
          retention-days: 1
          path: |
            fixtures/learning-ranking/golden-model.linux-x64.json
            fixtures/learning-ranking/golden-model.linux-x64.sha256
            fixtures/learning-ranking/task6-simulator-golden.linux-x64.json
            fixtures/learning-ranking/task6-simulator-golden.linux-x64.sha256
